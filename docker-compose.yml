# opensre + Postgres. Copy .env.example to .env and fill it in, then:
#   docker compose up -d
services:
  opensre:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: ghcr.io/openstatushq/opensre:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      OPENSRE_DB_URL: postgres://opensre:opensre@postgres:5432/opensre?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: opensre
      POSTGRES_PASSWORD: opensre
      POSTGRES_DB: opensre
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensre"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
