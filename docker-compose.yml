# stromboli + Postgres. Copy .env.example to .env and fill it in, then:
#   docker compose up -d
# This pulls the published image. To build from source instead: docker compose up -d --build
services:
  stromboli:
    image: ghcr.io/openstatushq/stromboli:${STROMBOLI_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${STROMBOLI_PORT:-8080}:8080"
    env_file: .env
    environment:
      STROMBOLI_DB_URL: postgres://stromboli:${POSTGRES_PASSWORD:-stromboli}@postgres:5432/stromboli?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: stromboli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stromboli}
      POSTGRES_DB: stromboli
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stromboli"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
