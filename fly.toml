# Fly.io deployment of stromboli (see docs/deploy/fly.md).
#
#   deploy/fly/setup.sh <app-name>          # first deploy: app, database, secrets
#   fly deploy --app <app-name> --ha=false  # later deploys
#
# `app` is a placeholder: Fly app names are global, so pass yours with --app.
# Plain settings live in [env]; secrets live in Fly (`fly secrets`), never here.
app = "stromboli"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "deploy/Dockerfile"

# Every variable the server reads (internal/config, internal/llm). Secrets
# (STROMBOLI_DB_URL, STROMBOLI_SECRET_KEY, STROMBOLI_API_TOKEN, STROMBOLI_WEBHOOK_TOKEN,
# the provider API keys, SLACK_*) are set with `fly secrets`.
[env]
  STROMBOLI_ADDR = ":8080"

  # --- Models ("provider:model") ---
  STROMBOLI_MODEL = "anthropic:claude-opus-5-5"
  # Optional: STROMBOLI_EFFORT, STROMBOLI_TRIAGE_MODEL, STROMBOLI_TRIAGE_EFFORT,
  # STROMBOLI_INVESTIGATE_MODEL, STROMBOLI_INVESTIGATE_EFFORT.

  # --- Investigation limits ---
  STROMBOLI_MAX_TOOL_CALLS = "30"
  STROMBOLI_MITIGATION_TOOL_CALLS = "6"
  STROMBOLI_INVESTIGATION_TIMEOUT = "8m"
  STROMBOLI_DEDUPE_WINDOW = "5m"

  # --- Machine actions (Fly.io): off in the server by default, on here ---
  STROMBOLI_ACTIONS_ENABLED = "true"
  STROMBOLI_ACTION_TTL = "30m"

  # --- Health checks (Fly.io): off in the server by default, hourly here ---
  # Checks memory, CPU, disk and volumes of every service with a fly metrics
  # source and investigates breaches. At least 5m; "0" turns it off.
  STROMBOLI_HEALTHCHECK_INTERVAL = "1h"

[http_service]
  internal_port = 8080
  force_https = true
  # stromboli receives webhooks and runs health checks on a timer: it must
  # never be stopped for being idle.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    # The server speaks h2c: lets gRPC clients and WatchInvestigation streams through.
    h2_backend = true

  # /healthz pings the database: a machine that can't reach it never takes traffic.
  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
