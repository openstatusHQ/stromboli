# Local development stack: Postgres, Loki and a demo app that writes logs
# (and starts a fake incident after a few minutes). Run opensre itself with
# `go run ./cmd/opensre serve` against it; see README.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: opensre
      POSTGRES_PASSWORD: opensre
      POSTGRES_DB: opensre
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensre"]
      interval: 2s
      timeout: 5s
      retries: 30

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  demo:
    image: golang:1.27-alpine
    working_dir: /src
    command: go run ./deploy/demo
    volumes:
      - .:/src:ro
      - go-cache:/root/.cache
      - go-mod:/go/pkg/mod
    environment:
      LOKI_URL: http://loki:3100
      DEMO_INCIDENT_AFTER: ${DEMO_INCIDENT_AFTER:-3m}
    depends_on:
      - loki

volumes:
  go-cache:
  go-mod:
