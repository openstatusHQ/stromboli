name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: opensre
          POSTGRES_PASSWORD: opensre
          POSTGRES_DB: opensre
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U opensre" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
        env:
          OPENSRE_TEST_DB_URL: postgres://opensre:opensre@localhost:5432/opensre?sslmode=disable

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=${{ github.base_ref }},subdir=.
          push: false
          format: false
